# Builds the browser version (`make web`) and deploys web/dist to Cloudflare,
# where rock.do.id.au is a Worker serving it (wrangler.jsonc), on every push to
# main that touches the game or the page, or by hand from the Actions tab. Pull
# requests are built and dry-run, but not deployed.
#
# The built site is cached, keyed by a hash of everything it's built from, so a
# run whose inputs have been built before skips Rust and the build entirely and
# just deploys (Wrangler then uploads nothing that hasn't changed).
#
# Set once in the repository's Settings → Secrets and variables → Actions: the
# secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, and Zone → Workers Routes:
# Edit for do.id.au) and the variable CLOUDFLARE_ACCOUNT_ID.

name: Web

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "levels/**"
      - "resources/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "web/**"
      - "Makefile"
      - "wrangler.jsonc"
      - ".github/workflows/web.yml"
  pull_request:
  workflow_dispatch:

# One deploy at a time; a newer push takes over from one still running.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Built site from an earlier run
        id: dist
        uses: actions/cache@v4
        with:
          path: web/dist
          key: rock-dist-${{ hashFiles('src/**', 'levels/**', 'resources/**', 'web/index.html', 'web/mq_js_bundle.js', 'Cargo.toml', 'Cargo.lock', 'Makefile') }}

      - name: Rust, with the WebAssembly target
        if: steps.dist.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache the build
        if: steps.dist.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Build
        if: steps.dist.outputs.cache-hit != 'true'
        run: make web

      - name: Check the Worker (dry run)
        run: npx --yes wrangler@4 deploy --dry-run --outdir wrangler-out

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
